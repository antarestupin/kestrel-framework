# Defines the application development container, local services, and persistent volumes.
# Adjust service ports and credentials here and keep application environment settings aligned.

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace/kestrel-playground
    volumes:
      - ..:/workspace/kestrel-playground:cached
      - node-modules:/workspace/kestrel-playground/node_modules
    command: /bin/sh -c "mkdir -p /workspace/kestrel-playground/node_modules && chown -R node:node /workspace/kestrel-playground/node_modules && sleep infinity"
    environment:
      HOST: 0.0.0.0
      PORT: "3333"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: "kestrel_playground"
      DB_TEST_DATABASE: "kestrel_playground_test"
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-bookworm
    ports:
      # Keep local development services reachable only from the host loopback interface.
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: "kestrel_playground"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kestrel_playground"]
      interval: 5s
      timeout: 5s
      retries: 10

  drizzle-studio:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.drizzle-studio
    init: true
    working_dir: /workspace/kestrel-playground
    user: node
    volumes:
      # Read live schema/configuration without sharing host or devcontainer dependencies.
      - ../src:/workspace/kestrel-playground/src:ro
      - ../drizzle.database.ts:/workspace/kestrel-playground/drizzle.database.ts:ro
      - ../drizzle.dev.config.ts:/workspace/kestrel-playground/drizzle.dev.config.ts:ro
    command: ["node", "node_modules/drizzle-kit/bin.cjs", "studio", "--config=drizzle.dev.config.ts", "--host=0.0.0.0", "--port=4983"]
    ports:
      - "127.0.0.1:4983:4983"
    environment:
      ENVIRONMENT: local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: "kestrel_playground"
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Wait for the local backend without depending on Drizzle's hosted browser UI.
      test: ["CMD", "node", "-e", "const socket = require('node:net').connect(4983, '127.0.0.1', () => socket.end()); socket.on('error', () => process.exit(1));"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  node-modules:
  postgres-data:
