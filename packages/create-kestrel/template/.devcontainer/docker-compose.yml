services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace/app
    volumes:
      - ..:/workspace/app:cached
      - node-modules:/workspace/app/node_modules
    command: /bin/sh -c "mkdir -p /workspace/app/node_modules && chown -R node:node /workspace/app/node_modules && sleep infinity"
    environment:
      HOST: 0.0.0.0
      PORT: "3333"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: kestrel_playground
      DB_TEST_DATABASE: kestrel_playground_test
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-bookworm
    ports:
      # Keep local development services reachable only from the host loopback interface.
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kestrel_playground
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kestrel_playground"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  node-modules:
  postgres-data:
