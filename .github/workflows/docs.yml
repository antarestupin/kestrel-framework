# Reuse one documentation build for release evidence and GitHub Pages deployment.
name: Documentation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      # Install the documentation dependency graph without framework/playground tooling.
      - run: npm ci --workspace=@kestrel/docs --include-workspace-root=false --ignore-scripts --no-audit --no-fund
      - run: npm run release:docs
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-evidence-${{ github.sha }}
          path: artifacts/documentation/reports/docs/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: src/apps/docs/build
