name: Documentation

on:
  push:
    branches: [main]
    paths: ['apps/docs/**', 'docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['apps/docs/**', 'docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/build

  # Pull requests validate the site; only main may publish the Pages artifact.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
