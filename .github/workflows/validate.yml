# Validate one pair of archives on both supported runtime checkpoints; never publish.
name: Validate
on: [push, pull_request, workflow_dispatch, merge_group]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      npm_config_engine_strict: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Use the same resolver at both Node checkpoints.
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run infra:up
      - run: npm run infra:prepare
      - run: npm run release:validate
      # Reuse the archives after switching runtime: no second framework build or pack.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
      # Use the same resolver at both Node checkpoints.
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:ai
      - run: npm run test:generator
      - run: npm run release:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate-${{ github.sha }}
          path: artifacts/candidate/
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: npm run infra:down
  # This stable name is the single required branch/ruleset check.
  release-validation:
    if: always()
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - name: Require successful candidate validation
        env:
          RESULT: ${{ needs.candidate.result }}
        run: test "$RESULT" = success
