# Build once and validate independent consumers on the supported minimum runtime; never publish to npm.
name: Validate
on:
  # Run the complete validation pipeline only when explicitly requested.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    uses: ./.github/workflows/docs.yml
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      npm_config_engine_strict: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run infra:up
      - run: npm run infra:prepare
      # Explicit paths keep artifact exchange deterministic across jobs.
      - run: npm run release:prepare -- artifacts/candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-candidate-${{ github.sha }}
          path: artifacts/candidate/
          if-no-files-found: error
          retention-days: 14
      # Workers need only immutable archives and metadata, not source-gate reports.
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-inputs-${{ github.sha }}
          path: |
            artifacts/candidate/*.tgz
            artifacts/candidate/candidate.json
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: npm run infra:down
  consumers:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Retain every independent failure report instead of cancelling sibling jobs.
      fail-fast: false
      matrix:
        selection: [package, postgres-app, redis-app, postgres-atlas-app, redis-atlas-app]
    env:
      npm_config_engine_strict: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: candidate-inputs-${{ github.sha }}
          path: artifacts/candidate
      # Verification scripts use Node built-ins; only isolated consumers install dependencies.
      - if: matrix.selection != 'package'
        # Generated HTTP tests inject Redis clients; production migrations require only PostgreSQL.
        run: npm run infra:up -- postgres
      - run: npm run release:consumer -- artifacts/candidate ${{ matrix.selection }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-${{ matrix.selection }}-${{ github.sha }}
          path: artifacts/candidate/reports/consumers/
          if-no-files-found: error
          retention-days: 14
      - if: always() && matrix.selection != 'package'
        run: npm run infra:down -- postgres
  # Keep this stable required check; only this job seals the assembled evidence.
  release-validation:
    if: always()
    needs: [candidate, documentation, consumers]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation jobs
        env:
          CANDIDATE: ${{ needs.candidate.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
          CONSUMERS: ${{ needs.consumers.result }}
        run: test "$CANDIDATE" = success && test "$DOCUMENTATION" = success && test "$CONSUMERS" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: prepared-candidate-${{ github.sha }}
          path: artifacts/candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: consumer-*-${{ github.sha }}
          path: artifacts/candidate/reports/consumers
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: documentation-evidence-${{ github.sha }}
          path: artifacts/candidate/reports/docs
      - run: npm run release:finalize -- artifacts/candidate
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: artifacts/candidate/
          if-no-files-found: error
          retention-days: 14
  # Deploy the documentation output already checked by the release gate.
  deploy-documentation:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: release-validation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
